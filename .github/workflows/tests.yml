name: Tests
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python checks
        run: |
          python -m compileall -q framingham.py cli.py test_framingham.py
          python -m unittest discover -v
      - name: Browser calculation checks
        run: |
          node --check risk.js
          node --test test_browser.cjs
